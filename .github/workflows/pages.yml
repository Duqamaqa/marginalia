name: Publish Marginalia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify vocabulary and export behavior
        run: npm test
      - name: Publish website files
        run: |
          git subtree split --prefix public --branch gh-pages
          git push origin gh-pages
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
